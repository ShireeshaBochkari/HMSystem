services:
  - type: web
    name: hostel-management
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString

databases:
  - name: hostel-db
    plan: free
    databaseName: hostel
    user: hostel
