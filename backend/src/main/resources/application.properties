server.port=${PORT:8080}
# Default = embedded H2 file DB (local, zero setup). In production (Render) DB_URL is set to Postgres by docker-entrypoint.sh.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hostel;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.secret=${APP_SECRET:change-me-please-use-a-long-random-secret-32+}
server.shutdown=graceful
